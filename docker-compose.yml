services:

  database:
    build: ./infraestrutura/database
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-vulneravel:
    build: ./infraestrutura/api
    ports:
      - "8081:5000"
    environment:
      - MODO_PROTEGIDO=False
      - DATABASE_URL=postgresql://user:password@database:5432/mydb
    volumes:
      - ./logs:/logs
    depends_on:
      database:
        condition: service_healthy

  api-protegida:
    build: ./infraestrutura/api
    ports:
      - "8082:5000"
    environment:
      - MODO_PROTEGIDO=True
      - DATABASE_URL=postgresql://user:password@database:5432/mydb
    volumes:
      - ./logs:/logs
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'