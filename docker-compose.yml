services:

  gateway:
    build: ./infraestrutura/gateway
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/logs
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./infraestrutura/api
    volumes:
      - ./logs:/logs
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:13
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./infraestrutura/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  attacker:
    build: ./atacante
    depends_on:
      gateway:
        condition: service_healthy